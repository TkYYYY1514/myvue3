<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #app {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
      }

      /* ===== 全局细滚动条 ===== */
      /* Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: #c0c4cc transparent;
      }

      /* Chrome / Edge / Safari */
      *::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      *::-webkit-scrollbar-track {
        background: transparent;
      }
      *::-webkit-scrollbar-thumb {
        background: #c0c4cc;
        border-radius: 3px;
      }
      *::-webkit-scrollbar-thumb:hover {
        background: #909399;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
